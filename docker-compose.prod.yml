# Production override for docker-compose.yml.
#
# The base file is the development setup (runserver + live bind-mounted
# source) and stays that way. This file layers on top of it to run the
# image as it will actually ship: Gunicorn serving the code baked into the
# image (no bind mount), DEBUG off, and Postgres never published to the host.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  web:
    # `!reset` replaces the base file's `- .:/app` source bind-mount rather than
    # merging with it, so the container runs the code COPY'd into the image at
    # build time, not the host checkout.
    #
    # The media volume is the one mount that must remain. static/uploads/ is
    # gitignored, so it is not in the image either — without this, every
    # `up --build` silently loses the uploaded logo and leaves the database
    # pointing at a file that no longer exists, which is a 500 on every page.
    volumes: !reset
      - media:/app/static/uploads
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      DJANGO_DEBUG: "0"

  db:
    # No `ports:` mapping here (the base file doesn't publish one either):
    # Postgres stays reachable only from other containers on the compose
    # network, never from the host or the public internet.
    ports: !reset []

volumes:
  media:
